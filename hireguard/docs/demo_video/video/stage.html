<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Venidis demo video stage</title>
<!-- Draws one frame of the demo video at a given time: render.mjs calls load() once, then renderAt(t) per frame and
     takes a screenshot. Pictures go on a canvas (high-quality scaling); highlights, labels, cursor and captions are DOM.
     Look: brand/README.md (ink, paper, one yellow). -->
<style>
  @font-face { font-family: "Figtree"; src: url("../../../frontend/node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2") format("woff2"); font-weight: 200 900; }
  :root { --ink: #111417; --paper: #EEF0EC; --dim: #A7AEB4; --y: #F5C842; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); font-family: "Figtree", "Segoe UI", system-ui, sans-serif; }
  canvas { position: absolute; inset: 0; }
  .box { position: absolute; border-radius: 10px; pointer-events: none;
         box-shadow: 0 0 0 4px var(--y), 0 0 0 9999px rgba(10, 12, 14, .34); }
  .label { position: absolute; pointer-events: none; white-space: nowrap; padding: 9px 16px 10px; border-radius: 8px;
           background: var(--y); color: var(--ink); font: 700 25px/1 "Figtree", sans-serif; letter-spacing: -.005em;
           box-shadow: 0 6px 18px rgba(10, 12, 14, .28); }
  #cursor { position: absolute; width: 52px; height: 52px; margin: -4px 0 0 -6px; opacity: 0; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
  #ripple { position: absolute; border-radius: 50%; border: 4px solid var(--y); opacity: 0; }
  .chip { position: absolute; left: 28px; top: 24px; display: flex; flex-direction: column; gap: 6px; padding: 15px 24px 16px;
          background: rgba(17, 20, 23, .93); border-radius: 12px; opacity: 0; box-shadow: 0 10px 30px rgba(10, 12, 14, .3); }
  .chip .m { font: 700 20px/1 "Figtree", sans-serif; color: var(--y); }
  .chip .t { font: 650 31px/1.12 "Figtree", sans-serif; color: var(--paper); letter-spacing: -.01em; }
  .chip .who { font: 500 19px/1.2 "Figtree", sans-serif; color: var(--dim); }
  .tag { position: absolute; right: 28px; top: 28px; padding: 10px 18px; border-radius: 8px; background: rgba(17, 20, 23, .88);
         color: var(--paper); font: 600 19px/1 "Figtree", sans-serif; opacity: 0; }
  .caption { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); max-width: 1440px; width: max-content;
             padding: 13px 28px 15px; border-radius: 10px; background: rgba(17, 20, 23, .86); color: var(--paper); text-align: center;
             font: 560 34px/1.32 "Figtree", sans-serif; letter-spacing: .002em; opacity: 0; }
  #fade { position: absolute; inset: 0; background: var(--ink); }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="boxes"></div>
<div id="ripple"></div>
<svg id="cursor" viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.3-4.1 2.9 6.6 2.7-1.2-2.9-6.5h6.1z" fill="#fff" stroke="#111417" stroke-width="1.4" stroke-linejoin="round"/></svg>
<div class="chip" id="chip"><span class="m"></span><span class="t"></span><span class="who"></span></div>
<div class="tag" id="tag">Fictional demo data</div>
<div class="caption" id="cap"></div>
<div id="fade"></div>
<script>
const W = 1920, H = 1080, FADE = 0.32, MAXZOOM = 1.6, CAPTION_BAND = 0.84;
const ctx = document.getElementById("c").getContext("2d");
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";
let TL = null, META = {}, WHO = {};
const images = new Map(); // src -> Promise<HTMLImageElement>

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const easeOut = (p) => 1 - Math.pow(1 - p, 3);

window.load = async (timeline, meta, who) => {
  TL = timeline; META = meta; WHO = who;
  for (const s of TL.shots) s.meta = META[s.id];
  // A caption lingers up to 0.35 s into the pause; cards of one sentence follow each other without a fade.
  TL.captions.sort((a, b) => a.start - b.start).forEach((c, i, all) => {
    const next = all[i + 1], prev = all[i - 1];
    c.shownEnd = next ? Math.min(c.end + 0.35, next.start) : c.end + 0.35;
    c.fadeIn = !prev || c.start - prev.shownEnd > 0.05;
    c.fadeOut = !next || next.start - c.shownEnd > 0.05;
  });
  await document.fonts.ready;
  return TL.shots.length;
};

function image(src) {
  if (!images.has(src)) {
    const img = new Image();
    img.src = src;
    images.set(src, img.decode().then(() => img));
  }
  return images.get(src);
}

// Keep only the pictures near t decoded: a 3840x2160 screenshot is 33 MB in memory.
async function prepare(t) {
  const near = new Set(TL.shots.filter((s) => s.end > t - 1 && s.start < t + 3).map((s) => s.meta.src));
  for (const src of [...images.keys()]) if (!near.has(src)) images.delete(src);
  await Promise.all([...near].map(image));
}

// Camera rectangle (picture pixels, 16:9) that frames a target in the area above the captions.
function frame(meta, name) {
  const full = [0, 0, meta.w, meta.h];
  const r = name === "full" ? null : meta.targets[name];
  if (!r) return full;
  const [tx, ty, tw, th] = r;
  const pad = 0.06 * meta.w;
  const need = Math.max(tw + 2 * pad, ((th + 2 * pad) / CAPTION_BAND) * (16 / 9));
  const w = clamp(need, meta.w / MAXZOOM, meta.w), h = (w * 9) / 16;
  const x = clamp(tx + tw / 2 - w / 2, 0, meta.w - w);
  const y = clamp(ty + th / 2 - h * CAPTION_BAND * 0.5, 0, meta.h - h);
  return [x, y, w, h];
}

function camera(shot, t) {
  const keys = shot.cam.map(([name, at]) => [at, frame(shot.meta, name)]);
  let rect = keys[0][1];
  for (let k = 0; k + 1 < keys.length; k++) {
    const [t0, a] = keys[k], [t1, b] = keys[k + 1];
    if (t < t0) break;
    const move = Math.min(1.2, Math.max(0.45, t1 - t0));
    const p = ease(clamp((t - (t1 - move)) / move, 0, 1));
    const wa = a[2], wb = b[2], w = wa * Math.pow(wb / wa, p);
    const cx = a[0] + a[2] / 2 + (b[0] + b[2] / 2 - a[0] - a[2] / 2) * p;
    const cy = a[1] + a[3] / 2 + (b[1] + b[3] / 2 - a[1] - a[3] / 2) * p;
    rect = [cx - w / 2, cy - (w * 9) / 32, w, (w * 9) / 16];
  }
  // A slow drift keeps still pictures alive.
  const drift = 1 - 0.02 * clamp((t - shot.start) / (shot.end - shot.start), 0, 1);
  const [x, y, w, h] = rect, nw = w * drift, nh = h * drift;
  return [clamp(x + (w - nw) / 2, 0, shot.meta.w - nw), clamp(y + (h - nh) / 2, 0, shot.meta.h - nh), nw, nh];
}

const toScreen = (cam, [x, y, w, h]) => { const s = W / cam[2]; return [(x - cam[0]) * s, (y - cam[1]) * s, w * s, h * s]; };

window.renderAt = async (t) => {
  await prepare(t);
  const live = TL.shots.filter((s) => t >= s.start - FADE / 2 && t < s.end + FADE / 2);
  ctx.fillStyle = "#111417";
  ctx.fillRect(0, 0, W, H);
  let top = null, topAlpha = 0;
  for (const [i, s] of live.entries()) {
    const alpha = i === 0 ? 1 : clamp((t - (s.start - FADE / 2)) / FADE, 0, 1);
    const img = await image(s.meta.src);
    const cam = camera(s, t);
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, cam[0], cam[1], cam[2], cam[3], 0, 0, W, H);
    top = { s, cam };
    topAlpha = alpha;
  }
  ctx.globalAlpha = 1;
  const slide = !top || top.s.id.startsWith("slide:");

  // Highlights of the picture on top, each with its label: above the box, or inside its top edge when there is no room.
  const boxes = document.getElementById("boxes");
  boxes.textContent = "";
  if (top) for (const [name, from, to, text] of top.s.box) {
    const r = top.s.meta.targets[name];
    if (!r || t < from || t > to) continue;
    const o = clamp((t - from) / 0.3, 0, 1) * clamp((to - t) / 0.3, 0, 1) * topAlpha;
    const [x, y, w, h] = toScreen(top.cam, r);
    const d = document.createElement("div");
    d.className = "box";
    Object.assign(d.style, { left: `${x - 10}px`, top: `${y - 10}px`, width: `${w + 20}px`, height: `${h + 20}px`, opacity: o });
    boxes.appendChild(d);
    if (text) {
      const l = document.createElement("div");
      l.className = "label";
      l.textContent = text;
      boxes.appendChild(l);
      const lw = l.offsetWidth, lh = l.offsetHeight, slideIn = 10 * (1 - easeOut(clamp((t - from) / 0.35, 0, 1)));
      const lx = clamp(x - 10, 16, W - lw - 16);
      const above = y - 10 - lh - 12 > 150;
      const ly = above ? y - 10 - lh - 12 : clamp(y + h + 22, 150, H - lh - 150);
      Object.assign(l.style, { left: `${lx}px`, top: `${ly + (above ? slideIn : -slideIn)}px`, opacity: o });
    }
  }

  // Cursor glides to the click target, then a ripple.
  const cursor = document.getElementById("cursor"), ripple = document.getElementById("ripple");
  cursor.style.opacity = 0; ripple.style.opacity = 0;
  for (const s of live) for (const [name, at] of s.click) {
    if (t < at - 0.9 || t > at + 0.7) continue;
    const r = s.meta.targets[name];
    if (!r) continue;
    const cam = camera(s, t);
    const [x, y, w, h] = toScreen(cam, r), cx = x + w / 2, cy = y + h / 2;
    const p = easeOut(clamp((t - (at - 0.9)) / 0.7, 0, 1));
    const px = cx + 190 * (1 - p), py = cy + 130 * (1 - p);
    const press = t >= at && t < at + 0.12 ? 0.86 : 1;
    Object.assign(cursor.style, { left: `${px}px`, top: `${py}px`, transform: `scale(${press})`,
      opacity: clamp((t - (at - 0.9)) / 0.2, 0, 1) * clamp((at + 0.7 - t) / 0.25, 0, 1) });
    if (t >= at) {
      const q = clamp((t - at) / 0.5, 0, 1), rad = 10 + 52 * easeOut(q);
      Object.assign(ripple.style, { left: `${cx - rad}px`, top: `${cy - rad}px`, width: `${2 * rad}px`, height: `${2 * rad}px`, opacity: 0.9 * (1 - q) });
    }
  }

  // Module and step (dashboard only), "fictional" tag, caption.
  const chip = document.getElementById("chip"), c = TL.chips.find((x) => t >= x.start && t < x.end && x.text);
  if (c && !slide) {
    chip.querySelector(".m").textContent = c.module || "Venidis";
    chip.querySelector(".t").textContent = c.text;
    chip.querySelector(".who").textContent = WHO[top.s.id] ? `Signed in as ${WHO[top.s.id]}` : "";
    chip.style.opacity = clamp((t - c.start) / 0.3, 0, 1) * clamp((c.end - t) / 0.3, 0, 1);
  } else chip.style.opacity = 0;
  document.getElementById("tag").style.opacity = slide ? 0 : topAlpha;
  const cap = document.getElementById("cap"), k = TL.captions.find((x) => t >= x.start && t < x.shownEnd);
  if (k) {
    cap.textContent = k.text;
    cap.style.opacity = (k.fadeIn ? clamp((t - k.start) / 0.12, 0, 1) : 1) * (k.fadeOut ? clamp((k.shownEnd - t) / 0.12, 0, 1) : 1);
  } else cap.style.opacity = 0;

  document.getElementById("fade").style.opacity = Math.max(clamp(1 - t / 0.6, 0, 1), clamp((t - (TL.duration - 0.9)) / 0.9, 0, 1));
  return true;
};
</script>
</body>
</html>
